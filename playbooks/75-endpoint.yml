---
# =========================================================================
# 75-endpoint.yml — endpoint telemetry into Security Onion
# =========================================================================
# Phases 10-60 give SO wire visibility via the GRE mirror: Zeek and Suricata
# parsing mirrored packets. That stops at the host boundary -- you see a
# workstation talk to a DC, not what ran on it. This phase adds the other
# half: Sysmon + Windows eventlogs + Linux telemetry, shipped by Elastic
# Agent into SO's own Fleet.
#
# PREREQUISITE: playbooks/05-time.yml. Endpoint events from a clock hours
# fast land in Elasticsearch ahead of the sensor data and make correlation
# meaningless. Run the clock fix first; site.yml orders it that way.
#
# NOTE ON SPLUNK: these hosts already run the Splunk universal forwarder to
# pp-splunk. Elastic Agent is additive, not a replacement -- the range keeps
# endpoint telemetry in both stacks.
# =========================================================================

# --- Sysmon ---------------------------------------------------------------
# Sysmon was already deployed by playbooks/00-baseline.yml, but ONLY in the
# "apply AUE settings" play, so it reached the [aue] workstations and nothing
# else. The DCs and corporate servers -- pp-dc01/02/03, pp-file, pp-sql,
# pp-mail -- had none, which is precisely where process ancestry matters most
# for reconstructing an intrusion.
#
# The role is idempotent (`creates_service: Sysmon64`), so re-running it
# against the AUE boxes that already have it is a no-op. Installer comes from
# the in-platform Nexus already configured in group_vars/windows.yml -- the
# established convention in this range, and not an egress dependency.
# Coverage is the [sysmon] inventory group, not `hosts: windows`. Brought in
# line with ss-pp-ab 2026-09-01: pp-dcs-ctrl is excluded by decision (OT
# control station — INSTRUMENT vs OBSERVE, see hosts), and the DMZ pair sits
# outside the corporate telemetry contract. A host pattern cannot express
# "everything except these three, on purpose"; a group can.
- name: Endpoint telemetry — Sysmon
  hosts: sysmon
  gather_facts: false
  strategy: free          # independent per-host installs; no cross-host sync
  roles:
    - sysmon
  tags:
    - sysmon
    - endpoint

# --- Verify Sysmon is actually running ------------------------------------
# `win_package` reporting success is not proof the service came up. Assert on
# the service state, per the standing rule in this repo about checks that
# cannot fail.
- name: Verify the Sysmon service is running
  hosts: sysmon
  gather_facts: false
  tasks:
    - name: Query the Sysmon64 service
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $svc = Get-Service -Name Sysmon64 -ErrorAction SilentlyContinue
          # [string] cast is required: $svc.Status is a ServiceControllerStatus
          # ENUM, which win_powershell serializes as
          # {"String":"Running","Type":...,"Value":4} -- a dict, never equal to
          # the string 'Running'. Every host failed a check it had passed.
          if ($svc) { Write-Output ([string]$svc.Status) } else { Write-Output "ABSENT" }
      register: sysmon_svc
      changed_when: false
      failed_when: sysmon_svc.output[0] | default('ABSENT') != 'Running'

    - name: Report
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: Sysmon64 {{ sysmon_svc.output[0] }}"
  tags:
    - sysmon
    - endpoint

# --- Stage SO's agent installers onto the controller's mirror -------------
# SO builds per-grid installers with the Fleet URL and enrollment token
# already embedded, so there is no secret to carry and nothing to fetch from
# the internet. They are ~213 MB each.
#
# WHY THE CONTROLLER AND NOT THE MANAGER: SO serves these at
# https://<manager>/packages/, but that path returns 503 on this grid, and
# pointing 44 hosts at the manager would have it serving ~8.5 GB while it is
# also ingesting from three sensors. The controller already runs nginx for
# so_apt_mirror, and endpoints already fetch Chrome, Sysmon and the Splunk
# forwarder over the mgmt plane from the in-platform Nexus -- this is the
# same delivery path they already use.
- name: Stage the Elastic Agent installers on the controller mirror
  hosts: ansible_controller
  # NO become. Nothing here needs root: so_apt_mirror creates the agents dir
  # owned by the ansible user, `fetch` writes as that user regardless, and
  # chmod on a file you own needs no privilege. This play previously carried
  # become: true and died on "sudo: a password is required" at the chmod --
  # asking for privilege it never needed.
  gather_facts: false
  tasks:
    # so_apt_mirror (phase 10) owns creating this, with the ownership that
    # lets an unprivileged fetch write into it. Fail clearly rather than
    # trying to create it here without privilege.
    - name: The agents mirror directory must exist
      ansible.builtin.stat:
        path: "{{ so_mirror_root }}/agents"
      register: agents_dir

    - name: Fail if phase 10 has not run
      ansible.builtin.fail:
        msg: >-
          {{ so_mirror_root }}/agents does not exist. so_apt_mirror creates it,
          owned by the ansible user so `fetch` can write into it — run
          playbooks/10-mirror.yml first.
      when: not agents_dir.stat.exists

    - name: Which installers are already staged?
      ansible.builtin.stat:
        path: "{{ so_mirror_root }}/agents/{{ item }}"
      register: staged
      loop:
        - "{{ so_agent_installer_windows }}"
        - "{{ so_agent_installer_linux }}"

    # fetch pulls manager -> controller over SSH. ~530 MB combined, once.
    # Guarded on the stat so a re-run does not move it again.
    # become is required HERE and nowhere else in this play. The installers are
    # root-owned on the manager, so the REMOTE read needs privilege -- while
    # the LOCAL write still happens as the ansible user regardless, which is
    # why the agents dir is ansible-user-owned (created by so_apt_mirror).
    #
    # Getting this wrong in BOTH directions cost two runs on 2026-08-04:
    # play-level become broke the unprivileged chmod, and then removing become
    # entirely broke this remote read. Per-task is the only correct answer.
    - name: Pull the installers from the manager
      become: true
      ansible.builtin.fetch:
        src: "/nsm/elastic-fleet/so_agent-installers/{{ item.item }}"
        dest: "{{ so_mirror_root }}/agents/{{ item.item }}"
        flat: true
      delegate_to: "{{ groups['so_manager'][0] }}"
      loop: "{{ staged.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists

    # Mode only, unprivileged -- the ansible user owns these files. NOT
    # chown'ing to www-data: that needs root, and would break the next fetch
    # after deleting one to force a refresh. Readable is all nginx needs.
    - name: Readable by nginx
      ansible.builtin.file:
        path: "{{ so_mirror_root }}/agents/{{ item }}"
        mode: '0644'
      loop:
        - "{{ so_agent_installer_windows }}"
        - "{{ so_agent_installer_linux }}"

    # Positive proof: HTTP-reachable, not merely present on disk. A file the
    # endpoints cannot actually GET is the failure this catches.
    - name: Smoke test — installers are served over HTTP
      ansible.builtin.uri:
        url: "http://127.0.0.1/agents/{{ item }}"
        method: HEAD
        status_code: 200
      loop:
        - "{{ so_agent_installer_windows }}"
        - "{{ so_agent_installer_linux }}"
      changed_when: false
  tags: [endpoint, agent]

# --- Open Fleet's ports to the endpoint subnets ---------------------------
# so-firewall writes to the firewall pillar, which is a salt INPUT, so this
# survives the 15-minute highstate. Editing rendered iptables would not --
# the same lesson as soc.json and the GRE rule.
- name: Permit the endpoint subnets to reach Fleet
  hosts: so_manager
  become: true
  gather_facts: false
  vars:
    # Every host that will run an agent: windows + linux, minus the OT
    # devices we cannot manage and minus the SO grid, which enrolls itself.
    agent_targets: >-
      {{ ((groups['windows'] | default([])) + (groups['linux'] | default([])))
         | difference(groups['unmanaged'] | default([]))
         | difference(groups['so_all'] | default([]))
         | unique | sort | list }}
  tasks:
    # Guard first: a host on a subnet nobody listed would install an agent
    # that can never enroll, and the only symptom would be a timeout 200
    # lines into a 44-host run. All declared subnets are /24, so comparing
    # the first three octets is exact here -- if a /27 or /16 is ever added,
    # this needs a real CIDR containment check (ansible.utils.ipaddr).
    - name: Collect each agent target's in-scenario network prefix
      ansible.builtin.set_fact:
        target_prefixes: >-
          {{ target_prefixes | default({}) | combine({ item: prefix }) }}
      vars:
        prefix: >-
          {{ (hostvars[item].network_interfaces | default([]))
             | map(attribute='ipv4.address') | select('defined')
             | reject('match', '^10\.255\.')
             | map('regex_replace', '^(\d+\.\d+\.\d+)\..*$', '\1')
             | first | default('NO-IN-SCENARIO-IP') }}
      loop: "{{ agent_targets }}"
      loop_control:
        label: "{{ item }}"
      run_once: true

    - name: Every agent target must sit in a declared endpoint subnet
      ansible.builtin.assert:
        that:
          - unlisted | length == 0
        fail_msg: |
          These agent targets are not covered by so_agent_endpoint_subnets:
            {{ unlisted | join(', ') }}
          Add their subnet to group_vars/all/security_onion.yml. Without it
          Fleet's ports stay closed and enrollment times out with no useful
          error on the endpoint itself.
        success_msg: "all {{ agent_targets | length }} agent targets are covered"
      vars:
        declared: >-
          {{ so_agent_endpoint_subnets
             | map('regex_replace', '^(\d+\.\d+\.\d+)\..*$', '\1') | list }}
        unlisted: >-
          {{ target_prefixes | dict2items
             | rejectattr('value', 'in', declared)
             | map(attribute='key') | list }}
      run_once: true

    # so-firewall is NOT idempotent: re-adding an existing entry exits rc=3
    # with "WARNING - IP x already exists in hostgroup y" on stderr. That is a
    # success for our purposes -- the subnet is permitted either way. Treating
    # it as failure aborted the whole run before the Linux hosts enrolled,
    # because every host in this play failed. Same tolerance the grid-join
    # firewall task in so_search already uses.
    - name: Include each endpoint subnet in the {{ so_agent_firewall_hostgroup }} hostgroup
      ansible.builtin.command: >-
        so-firewall includehost {{ so_agent_firewall_hostgroup }} {{ item }}
      loop: "{{ so_agent_endpoint_subnets }}"
      register: fw_include
      changed_when: fw_include.rc == 0
      failed_when:
        - fw_include.rc != 0
        - "'already exists' not in fw_include.stderr"
      run_once: true

    - name: Apply the firewall state
      ansible.builtin.command: "so-firewall apply"
      run_once: true
      register: fw_apply
      changed_when: fw_apply.rc == 0
      until: fw_apply.rc == 0
      retries: 40
      delay: 30

    # Proof the rules are in the RUNNING ruleset, not just the pillar.
    # Scoped to DOCKER-USER specifically. Fleet server runs in a container, so
    # its traffic is filtered there, not in INPUT -- grepping the whole ruleset
    # would accept an INPUT rule that has no bearing on whether an agent can
    # reach 8220. Verified against the live ruleset on 2026-08-05: every
    # elastic_agent_endpoint rule lands in DOCKER-USER.
    - name: Verify every endpoint subnet is permitted to 8220 in DOCKER-USER
      ansible.builtin.shell: |
        set -o pipefail
        iptables -S DOCKER-USER \
          | grep -E -- "-s {{ item | regex_escape }}( |/32 )" \
          | grep -c -- "--dport 8220" || true
      args:
        executable: /bin/bash
      loop: "{{ so_agent_endpoint_subnets }}"
      register: fw_proof
      changed_when: false
      failed_when: (fw_proof.stdout | trim | int) < 1
      run_once: true
  tags: [endpoint, agent, firewall]

# --- Enroll every endpoint ------------------------------------------------
# serial: 8 deliberately. 44 hosts pulling ~213 MB simultaneously would move
# ~8.5 GB through one nginx while the manager is also ingesting from three
# sensors. Batches of 8 keep that bounded; the whole run is slower but does
# not starve the grid it is feeding.
- name: Enroll endpoints into Security Onion's Fleet
  hosts: windows:linux:!unmanaged:!so_all
  gather_facts: false
  serial: 8
  roles:
    - elastic_agent
  tags: [endpoint, agent]

# --- Prove it from Fleet's side, not the endpoints' -----------------------
# Every endpoint reporting "service running" is not the same as Fleet having
# them enrolled and healthy. Ask the authority.
- name: Verify enrollment from Fleet
  hosts: so_manager
  become: true
  gather_facts: false
  vars:
    agent_targets: >-
      {{ ((groups['windows'] | default([])) + (groups['linux'] | default([])))
         | difference(groups['unmanaged'] | default([]))
         | difference(groups['so_all'] | default([]))
         | unique | sort | list }}
  tasks:
    # A raw COUNT cannot tell you which hosts enrolled. On 2026-08-05 it
    # reported the expected 49 while pp-proxy and pp-syslog had visibly failed
    # their preflight and installed nothing -- the SO grid contributes more
    # agent documents than the 5 nodes I assumed, and the numbers happened to
    # cancel out. A check whose pass condition can be met by unrelated
    # documents is not measuring enrollment. Ask WHICH hostnames Fleet knows.
    - name: List the hostnames Fleet has enrolled
      ansible.builtin.shell: |
        set -o pipefail
        so-elasticsearch-query ".fleet-agents/_search?size=500" | python3 -c '
        import json,sys
        d = json.load(sys.stdin)
        names = set()
        for h in d.get("hits", {}).get("hits", []):
            src = h.get("_source", {}) or {}
            host = ((src.get("local_metadata") or {}).get("host") or {})
            n = host.get("hostname")
            if n:
                names.add(n.lower())
        print("\n".join(sorted(names)))
        '
      args:
        executable: /bin/bash
      register: fleet_hosts
      changed_when: false
      failed_when: false

    - name: Fail if Fleet could not be queried at all
      ansible.builtin.fail:
        msg: |
          Could not list enrolled agents from Elasticsearch.
          rc={{ fleet_hosts.rc }}
          stdout: {{ fleet_hosts.stdout | default('') }}
          stderr: {{ fleet_hosts.stderr | default('') }}

          Enrollment is therefore UNVERIFIED. Do not read a clean run as proof.
      when: fleet_hosts.rc != 0

    - name: Report enrollment
      ansible.builtin.debug:
        msg: >-
          Fleet knows {{ fleet_hosts.stdout_lines | length }} hostnames.
          Expected {{ agent_targets | length }} endpoints
          + {{ groups['so_all'] | default([]) | length }} SO grid nodes.
          Missing: {{ missing | join(', ') if missing else 'none' }}
      vars:
        missing: >-
          {{ agent_targets | map('lower') | list
             | difference(fleet_hosts.stdout_lines | map('trim') | list) }}

    - name: Fail if any agent target is absent from Fleet
      ansible.builtin.fail:
        msg: |
          These hosts are NOT enrolled in Fleet:
            {{ missing | join(', ') }}

          The agent installed but never registered, or never installed at all.
          Check /opt/Elastic/Agent/elastic-agent.log (Linux) or
          C:\Program Files\Elastic\Agent\elastic-agent.log (Windows) on one of
          them, and confirm the {{ so_agent_firewall_hostgroup }} hostgroup
          covers its subnet.
      vars:
        missing: >-
          {{ agent_targets | map('lower') | list
             | difference(fleet_hosts.stdout_lines | map('trim') | list) }}
      when: missing | length > 0
  tags: [endpoint, agent]

# --- The same gate, for the other SIEM ------------------------------------
# ss-pp-stacked runs BOTH a Security Onion grid and a Splunk cluster, and 48
# hosts carry both an Elastic Agent and a universal forwarder. Until
# 2026-09-21 only one of those was gated inside the deploy: a host missing
# from Fleet failed the run, while a host sending nothing to Splunk did not.
# The Splunk equivalent lived in verify_deployment.sh, which runs separately
# and afterwards, so a deploy could report SUCCESS with a host dark to Splunk.
#
# Two assertions, in this order, because they fail for different reasons:
#
#   1. CONFIGURATION. A Windows host in neither [splunk-forwarder] nor
#      [splunk_forwarder_exempt] was never going to forward. This is pure
#      inventory and needs no Splunk at all. It is the pp-dcs-ctrl case:
#      [ot_servers] was never made a child of [splunk-forwarder], so a host
#      sat dark and every count-based check reported a clean pass, because
#      counting hosts that forward AGAINST the group that should forward can
#      never see a host missing from the group.
#
#   2. ARRIVAL. A host configured to forward that Splunk has never heard
#      from. Asked of Splunk, not of the host: a universal forwarder can be
#      running, connected and correctly configured and still deliver nothing,
#      which is exactly what a `service running` check calls a pass.
- name: Verify forwarder coverage from Splunk
  hosts: splunk_search_head
  become: true
  gather_facts: false
  vars:
    # splunk_verify_app_dir is a DEFAULT OF roles/splunk-verify-user, and role
    # defaults are only in scope while that role runs. This play does not run
    # it, so the bare name is undefined here and the gate would die on the
    # first task with an undefined-variable error rather than checking
    # anything. Resolved with an explicit fallback to the same path the role
    # uses; if it ever is in scope, that value wins.
    splunk_verify_bin: >-
      {{ splunk_verify_app_dir | default('/opt/splunk/etc/apps/arbitr_verify') }}/bin/verify_data.sh
    # Basis is [windows], deliberately, matching verify_deployment.sh §13.
    # [members] is domain membership and excludes the DCs and both DMZ hosts --
    # the highest-value log sources here -- so anchoring on it would produce a
    # check that structurally could not report a dark DC.
    forwarder_targets: >-
      {{ (groups['splunk-forwarder'] | default([]))
         | difference(groups['splunk_forwarder_exempt'] | default([]))
         | unique | sort | list }}
  tasks:
    - name: Fail if a Windows host forwards to nothing and is not exempt
      ansible.builtin.fail:
        msg: |
          These Windows hosts are in neither [splunk-forwarder] nor
          [splunk_forwarder_exempt]:
            {{ unconfigured | join(', ') }}

          They will produce no Splunk telemetry, and no count-based check can
          notice: counting forwarders against [splunk-forwarder] only ever
          asks about hosts already in the group.

          Either add them to [splunk-forwarder], or record the decision in
          [splunk_forwarder_exempt] so it is a choice rather than an omission.
      vars:
        unconfigured: >-
          {{ (groups['windows'] | default([]))
             | difference(groups['splunk-forwarder'] | default([]))
             | difference(groups['splunk_forwarder_exempt'] | default([]))
             | sort | list }}
      when: unconfigured | length > 0

    - name: List the hosts Splunk has received events from
      # cut -d. -f1 is load-bearing. Splunk's `host` field carries whatever the
      # forwarder resolved for itself, which is the FQDN on a domain-joined
      # host and the short name otherwise. Inventory names are short, so
      # without this the diff finds nothing in common and the gate fails EVERY
      # deploy while reporting all 51 hosts dark -- a check that cries wolf
      # gets disabled, which is worse than not having it.
      ansible.builtin.shell: |
        {{ splunk_verify_bin }} fwd_coverage 2>/dev/null |
          sed -n 's/^FWDHOST //p' | cut -d. -f1 | tr -d '\r' |
          sed '/^$/d' | sort -u
      args:
        executable: /bin/bash
      register: splunk_reporting
      changed_when: false
      failed_when: false

    # Distinguish "Splunk says nobody reported" from "we could not ask Splunk".
    # Without this, a broken search account reads as total forwarder failure
    # and sends you to 51 healthy hosts.
    - name: Fail if Splunk could not be queried at all
      ansible.builtin.fail:
        msg: |
          Could not query Splunk for forwarder coverage (rc={{ splunk_reporting.rc }}).

          This is a search problem, not a forwarder problem -- do not go
          looking at the endpoints. Check:
            {{ splunk_verify_bin }} visibility
            {{ splunk_verify_bin }} whatsee
      when: splunk_reporting.rc != 0

    - name: Report forwarder coverage
      ansible.builtin.debug:
        msg: |
          Splunk has heard from {{ splunk_reporting.stdout_lines | length }} hosts.
          Expected {{ forwarder_targets | length }} forwarder targets.
          Missing: {{ missing | join(', ') if missing else 'none' }}
      vars:
        missing: >-
          {{ forwarder_targets | map('lower') | list
             | difference(splunk_reporting.stdout_lines | map('trim') | list) }}

    - name: Fail if any forwarder target has sent nothing
      ansible.builtin.fail:
        msg: |
          These hosts are configured to forward but Splunk has received
          nothing from them:
            {{ missing | join(', ') }}

          The forwarder installed but never connected, never started, or is
          connected and delivering nothing. On one of them check:
            Windows : C:\Program Files\SplunkUniversalForwarder\var\log\splunk\splunkd.log
            Linux   : /opt/splunkforwarder/var/log/splunk/splunkd.log
          and confirm outputs.conf points at the indexer peers.
      vars:
        missing: >-
          {{ forwarder_targets | map('lower') | list
             | difference(splunk_reporting.stdout_lines | map('trim') | list) }}
      when: missing | length > 0
  tags: [endpoint, splunk, forwarder_coverage]
