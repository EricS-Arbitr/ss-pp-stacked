- name: Install control-script prerequisites (incl. git for the clone)
  ansible.builtin.apt:
    name:
      - git
      - python3-dotenv
      - python3-requests
      - python3-ruamel.yaml
      - openssl
      - apache2-utils
    state: present
    cache_valid_time: 3600
    lock_timeout: "{{ malcolm_apt_lock_timeout }}"

- name: Create Malcolm group
  ansible.builtin.group:
    name: "{{ malcolm_group }}"
    system: true

- name: Create Malcolm service user
  ansible.builtin.user:
    name: "{{ malcolm_user }}"
    group: "{{ malcolm_group }}"
    groups: docker
    append: true
    system: true
    home: "{{ malcolm_home }}"
    create_home: true
    shell: /usr/sbin/nologin
  register: malcolm_user_info

- name: Record Malcolm UID/GID
  ansible.builtin.set_fact:
    malcolm_uid: "{{ malcolm_user_info.uid }}"
    malcolm_gid: "{{ malcolm_user_info.group }}"

# THIS ITERATION clones the Malcolm source straight from GitHub through the
# proxy (the play sets http(s)_proxy, which git honours for https remotes),
# pinned to the release tag. A later air-gapped pass would point
# malcolm_repo_url at a local mirror instead.
#
# Explicit `git clone --depth 1 --branch <tag>` rather than ansible.builtin.git:
# the module treats a tag as a branch (refs/heads/<tag>) and, with depth set,
# resolves it against `origin` before a repo exists -- which fails with
# "'origin' does not appear to be a git repository". git's own --branch takes a
# tag for a shallow clone. `creates` makes it idempotent; git clones into the
# (absent or empty) dest, and the chown below hands the tree to the Malcolm user.
- name: Clone the Malcolm source at the pinned release tag (shallow, via proxy)  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: "git clone --depth 1 --branch {{ malcolm_repo_version }} {{ malcolm_repo_url }} {{ malcolm_install_dir }}"
    creates: "{{ malcolm_install_dir }}/.git"
  register: malcolm_clone
  changed_when: true

- name: Ensure the install tree is owned by the Malcolm user
  ansible.builtin.file:
    path: "{{ malcolm_install_dir }}"
    state: directory
    owner: "{{ malcolm_user }}"
    group: "{{ malcolm_group }}"
    recurse: true
  when: malcolm_clone is changed

# control.py runs as the malcolm user and chdirs into the install dir. The
# system malcolm user must be able to traverse every parent, including the
# /mnt/Expansion mount (which is not world-traversable by default) and the
# install dir itself. Enforced every run (cheap, non-recursive) so it is right
# regardless of whether the clone ran this pass. "Permission denied: changing
# directory before execution" on /mnt/Expansion/malcolm is exactly this.
- name: Make the data mount traversable by the Malcolm user
  ansible.builtin.file:
    path: "{{ malcolm_install_dir | dirname }}"
    state: directory
    mode: "0755"

- name: Ensure the install dir is owned by and traversable for the Malcolm user
  ansible.builtin.file:
    path: "{{ malcolm_install_dir }}"
    state: directory
    owner: "{{ malcolm_user }}"
    group: "{{ malcolm_group }}"
    mode: "0755"

- name: Confirm the clone produced a Malcolm tree
  ansible.builtin.stat:
    path: "{{ malcolm_install_dir }}/docker-compose.yml"
  register: malcolm_compose_stat

- name: Fail if docker-compose.yml is missing after the clone
  ansible.builtin.fail:
    msg: >-
      {{ malcolm_install_dir }}/docker-compose.yml not found after cloning
      {{ malcolm_repo_url }}@{{ malcolm_repo_version }}.
  when: not malcolm_compose_stat.stat.exists

- name: Point images at the configured registry (no-op on the default)
  ansible.builtin.replace:
    path: "{{ malcolm_install_dir }}/docker-compose.yml"
    regexp: 'image: {{ malcolm_image_registry_default | regex_escape }}/'
    replace: "image: {{ malcolm_image_registry }}/"
  when: malcolm_image_registry != malcolm_image_registry_default
