---
# init — overlay of range-development-ansible/roles/init
#
# The base role waits `delay: 30` + `timeout: 60` for WinRM, which is the
# `elapsed: 90` seen in failed runs. Sixty seconds is not enough for a cold
# Windows boot on a freshly provisioned range: on 2026-08-07, four hosts
# (pp-eng-wkstn-5/6/7, pp-is-wkstn-3) refused 5985 and failed attempt 1 of a
# blueprint-driven deploy even with BOOT_DELAY=180 already elapsed.
#
# Raising deploy.sh's BOOT_DELAY instead would be the wrong lever: it delays
# EVERY deploy including re-runs where everything is already up. A longer wait
# costs nothing when the host is ready -- wait_for_connection returns as soon
# as the connection succeeds.
#
# 2400 = 40 minutes. Raised from 900 on 2026-09-20, after pp-bp-wkstn-4 failed
# a cold build with
#
#   pp-bp-wkstn-4 : ok=0 changed=0 unreachable=0 failed=1 skipped=0
#
# -- zero tasks, meaning it failed this very wait and ran nothing else. The
# same host was ok=72 in the previous build, so it is not a broken machine; it
# is a cold boot that took longer than fifteen minutes. airfield-range reached
# this figure ahead of us: 1800 was not enough there on 2026-09-15 with four
# hosts still silent at the thirty-minute mark, and it has run at 2400 since.
#
# The ceiling is affordable ONLY because the Init play no longer carries
# any_errors_fatal (see playbooks/00-baseline.yml). With that flag, a host
# sitting here for forty minutes and then failing would take every other
# Windows host in the play with it. Without it, it drops out alone and the
# end-of-run coverage assertions remain the hard gate. Do not raise one
# without checking the other.
init_wait_timeout: 2400

# --- Stability gate (see tasks/wait_stable.yml) ---------------------------
# How long a host must have been up before the run configures it. A host that
# has been up three minutes when init reaches it waits zero seconds.
init_stable_uptime: 180
# Budget for a host that is REACHABLE but still rebooting or servicing.
init_stable_retries: 80
# Budget for one that vanished mid-probe. Generous on purpose: a customer
# watching the provisioning UI can reprovision a bad workstation, and this
# window is what lets the run pick it up rather than forcing another attempt.
init_stable_recover_timeout: 1800

# How long a host may have NO ROUTE from the controller before init declares it
# absent rather than slow. 20 x 15s = 5 minutes.
#
# This is the counterweight to the ceiling above. EHOSTUNREACH is not a boot in
# progress -- it means ARP never resolved and there is nothing on the address.
# pp-bp-wkstn-4 produced it identically in all three attempts of a 7h25m build
# on 2026-09-20. Without this, raising the ceiling to 2400 would have made that
# host cost 40 minutes per attempt instead of 15, on a run doomed either way.
# 120 x 15s = 30 MINUTES, matching init_stable_recover_timeout. Was 20 (five
# minutes) until 2026-09-22, which was inconsistent in the wrong direction: a
# host that appeared and then vanished got thirty minutes to come back, while
# one that never appeared at all got five.
#
# The fast-fail exists for its DIAGNOSIS, not its speed. EHOSTUNREACH means
# ARP never resolved and the host is not on the network -- a different fault
# from a slow boot, needing a different response -- and saying so plainly is
# the value. Saying it after five minutes is not.
#
# Thirty minutes is sized against how this is actually operated: SimSpace
# customers watch provisioning state in a UI, not these logs. A workstation
# that failed to provision is visible to them, they can reprovision that one
# system, and this window is what lets attempt 1 pick it up rather than the
# run failing and costing a full extra pass. Five minutes was far shorter than
# anyone can notice and act.
init_noroute_retries: 120
init_wait_delay: 15
init_wait_sleep: 10

# --- Default-gateway ARP poisoning (see tasks/main.yaml) ------------------
# MACs known to falsely answer ARP for a gateway address. The task flushes and
# re-probes until the learned MAC is not on this list, then pins it.
# 00:50:56:98:7D:D7 has been observed on four subnets across three independent
# ranges; every real router interface in these ranges is in the :A8: block.
# pp-dc03 was the first casualty, 2026-08-25.
init_gw_arp_blocklist:
  - "00-50-56-98-7D-D7"
# How many flush/re-probe cycles before giving up and reporting INIT_GW_FAIL.
init_gw_arp_attempts: 6

# Off-subnet addresses the gateway-ARP check may probe, tried before the
# host's own DNS servers. Needed because DNS is NOT reliably off-subnet -- on
# airfield 2026-09-17 the Services segment held both the file servers and
# their DCs, so pinging DNS never crossed the gateway and the check pinned a
# black-hole MAC as Permanent, isolating the host.
#
# The check verifies each candidate is genuinely off-subnet against the host's
# own addresses, and refuses to pin at all when none is: an unpinned gateway
# is the status quo, a wrongly pinned one is an isolated host.
#
# so-manager first -- 172.16.9.x is off-subnet for every Windows segment here
# (172.16.2-6.x). pp-syslog is on 172.16.2.0/24, so it is correctly skipped
# for hosts in that segment and used for the rest.
init_gw_probe_targets:
  - "172.16.9.30"      # so-manager
  - "172.16.2.9"       # pp-syslog
