---
# =========================================================================
# site.yml — full stacked deploy: PowerPlant range, Splunk, Security Onion
# =========================================================================
# Order matters and each stage depends on the one before.
#
#   00-baseline         the range itself — network, AD, endpoints, and the
#                       distributed Splunk cluster.
#   05-time             NTP-less clock sync; SO's certificates fail on skew
#   10-mirror           controller-hosted mirror of the SO install artifacts
#   20-vyos             gretap tunnels + tc mirrors on the three routers
#   30-prereqs          so_base on every SO node
#   40-manager          so-setup on the manager — 20-30 minutes
#   50-nodes            search node and sensors join the grid
#   60-verify           end-to-end checks
#   75-endpoint         Sysmon, then Elastic Agent enrolment into SO's Fleet
#
# BOTH SIEMs ARE FED ENDPOINT DATA, AND THAT IS DELIBERATE.
#
# This range exists to work the same telemetry in either tool, so the endpoints
# carry a Splunk universal forwarder (from 00-baseline) AND an Elastic Agent
# (from 75-endpoint). The two read the same sources independently; neither
# depends on the other and neither can starve the other.
#
# 75-endpoint was left unimported until 2026-09-18 on the reasoning that the
# Splunk forwarder already covered these hosts. It does -- for Splunk. Security
# Onion saw only Zeek and Suricata off the sensor mirrors, so process, file,
# registry and Windows event data reached one SIEM and not the other.
#
# WHAT THIS PUTS AN AGENT ON. The enrolment play targets
# `windows:linux:!unmanaged:!so_all`, which includes the four Splunk cluster
# hosts. That is intended -- an indexer is exactly the kind of host worth
# watching -- but it is why so_defend_exclusions carries a /opt/splunk/var
# filter: without it, Splunk bucket and dispatch churn is ~96% of that host's
# telemetry and dominates ES retention. The filter is path-scoped, not
# host-scoped, so it covers all four.
#
# The SO grid itself is excluded (`!so_all`): SO runs its own agent on every
# grid node, and a second one would double-ship and fight its log rotation.
#
# SEQUENCING NOTE: Security Onion runs AFTER the range playbook, not
# interleaved. The SO nodes need routing, DNS and the mirror path live before
# so-setup runs, and the mirror sources are the same VyOS routers the range
# playbook configures.
# =========================================================================

# Mirror FIRST — fail fast (it is a hard prereq for 30/40/50) and it
# kicks the 7.2 GB container-image build off in the BACKGROUND, so the
# baseline runs while it downloads. 40-manager blocks on the artifacts.
# Safe to hoist: nothing ahead of it ever targeted the controller.
- import_playbook: playbooks/10-mirror.yml

- import_playbook: playbooks/00-baseline.yml

- import_playbook: playbooks/05-time.yml
- import_playbook: playbooks/20-vyos.yml
- import_playbook: playbooks/30-prereqs.yml
- import_playbook: playbooks/40-manager.yml
- import_playbook: playbooks/50-nodes.yml
- import_playbook: playbooks/60-verify.yml

# Endpoint telemetry into Security Onion. AFTER 60-verify: enrolment needs a
# manager that is actually green, and Fleet has to be answering before an agent
# can register with it.
- import_playbook: playbooks/75-endpoint.yml
